<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFauna - Contato</title>
    <link rel="shortcut icon" href="globo.png" type="image/x-icon">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">EcoFauna</a>
        
        <nav class="navbar">
            <a href="index.html">Início</a>
            <a href="contato.html">Contato</a>
        </nav>

        <div class="bx bx-menu" id="menu-icon"></div>
    </header>

    <main>
        <section>
            <h1 class="page-title">Contato</h1>
            
            <form class="contact-form" id="contactForm" novalidate>
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input id="nome" name="nome" type="text" placeholder="Seu nome completo" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input id="email" name="email" type="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="assunto">Assunto:</label>
                    <input id="assunto" name="assunto" type="text" placeholder="Sobre o que deseja falar?">
                </div>
                
                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem..." required></textarea>
                </div>
                
                <button type="submit" class="btn">Enviar</button>
            </form>

            <!-- Mapa Responsivo -->
            <div class="responsive-map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d908.4447956792646!2d-53.21393153823886!3d-17.318743987407128!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x937c9aad935629a1%3A0xfd6f0518555be7ca!2sUNEMAT%20Universidade%20do%20Estado%20de%20Mato%20Grosso%20(Campus%20Alto%20Araguaia)!5e0!3m2!1spt-BR!2sbr!4v1761088377267!5m2!1spt-BR!2sbr" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
    </main>
    
    <footer class="footer">
        <p>Todos os direitos reservados - Ana Moraes (2025)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
